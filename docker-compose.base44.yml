services:
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 http://127.0.0.1:5173/ | grep -qi '<html' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  node_modules:
